name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Super-Portapapeles-unsigned
          path: Super-Portapapeles-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

